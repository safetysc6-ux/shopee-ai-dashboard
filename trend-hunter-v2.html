<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trend Hunter V2</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-50 text-slate-900"><main class="max-w-7xl mx-auto p-4 md:p-6"><header class="flex flex-col md:flex-row gap-3 justify-between mb-6"><div><p class="text-orange-600 font-bold text-sm">Shopee Product Radar</p><h1 class="text-3xl font-black">Trend Hunter V2</h1><p class="text-sm text-slate-500">จับสินค้าที่กำลังเร่งตัวจาก Snapshot 1D / 3D / 7D ก่อนแมส</p></div><div class="flex gap-2"><button id="refresh" class="px-4 py-2 border bg-white rounded-xl">รีเฟรช</button><button id="add" class="px-4 py-2 bg-orange-600 text-white font-bold rounded-xl">+ เพิ่ม Snapshot</button></div></header><section class="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-5"><div class="bg-white rounded-2xl p-4"><p class="text-xs text-slate-500">บนเรดาร์</p><b id="k1" class="text-2xl">0</b></div><div class="bg-white rounded-2xl p-4"><p class="text-xs text-slate-500">⚡ Early Signal</p><b id="k0" class="text-2xl text-violet-600">0</b></div><div class="bg-white rounded-2xl p-4"><p class="text-xs text-slate-500">🔥 ทำทันที</p><b id="k2" class="text-2xl">0</b></div><div class="bg-white rounded-2xl p-4"><p class="text-xs text-slate-500">👀 จับตา</p><b id="k3" class="text-2xl">0</b></div><div class="bg-white rounded-2xl p-4"><p class="text-xs text-slate-500">🎬 Queue</p><b id="k4" class="text-2xl">0</b></div></section><section class="bg-white p-3 rounded-2xl mb-4 flex gap-2"><input id="q" class="border rounded-xl px-3 py-2 flex-1" placeholder="ค้นหาสินค้า/หมวด"><select id="filter" class="border rounded-xl px-3"><option value="all">ทั้งหมด</option><option value="early">Early Signal</option><option value="hot">ทำทันที</option><option value="watch">จับตา</option><option value="queue">Queue</option></select></section><div id="status" class="text-sm text-slate-500 mb-3"></div><section id="grid" class="grid md:grid-cols-2 xl:grid-cols-3 gap-4"></section></main><dialog id="modal" class="rounded-2xl p-0 w-[94%] max-w-xl"><form id="form" class="p-5 bg-white rounded-2xl"><div class="flex justify-between mb-4"><h2 class="font-black text-xl">เพิ่ม Snapshot สินค้า</h2><button type="button" id="close">×</button></div><div class="grid grid-cols-2 gap-3"><label class="col-span-2 text-sm">ชื่อสินค้า<input required name="name" class="mt-1 w-full border rounded-xl px-3 py-2"></label><label class="text-sm">หมวด<input name="category" class="mt-1 w-full border rounded-xl px-3 py-2"></label><label class="text-sm">วันที่ Snapshot<input name="snapshot_date" type="date" class="mt-1 w-full border rounded-xl px-3 py-2"></label><label class="text-sm">ราคา<input name="price" type="number" step="0.01" class="mt-1 w-full border rounded-xl px-3 py-2"></label><label class="text-sm">ยอดขายสะสม<input required name="sales_today" type="number" class="mt-1 w-full border rounded-xl px-3 py-2"></label><label class="text-sm">รีวิว<input name="reviews" type="number" class="mt-1 w-full border rounded-xl px-3 py-2"></label><label class="text-sm">คลิปคู่แข่ง<input name="videos" type="number" class="mt-1 w-full border rounded-xl px-3 py-2"></label><label class="text-sm">คอม %<input name="commission" type="number" step="0.1" class="mt-1 w-full border rounded-xl px-3 py-2"></label><label class="col-span-2 text-sm">ลิงก์สินค้า<input name="url" class="mt-1 w-full border rounded-xl px-3 py-2"></label></div><button class="mt-4 w-full py-3 rounded-xl bg-orange-600 text-white font-bold">บันทึก Snapshot</button></form></dialog><script>
const API='https://shopee-trend-hunter.safetysc6.workers.dev/api/trends';let rows=[];const e=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));const p=v=>(v>=0?'+':'')+Number(v||0).toFixed(0)+'%';const idea=x=>/ครัว|ชั้น|ซิงก์|rack/i.test(x.category+' '+x.name)?'Problem → เคลียร์พื้นที่ → ติดตั้ง → Before/After':/พื้น|ไม้|กระเบื้อง|หญ้า/i.test(x.category+' '+x.name)?'พื้นเก่า → เตรียมผิว → ปูทีละชิ้น → Final reveal':'Hook ปัญหา → Demo → Proof → Result → CTA';async function load(){status.textContent='กำลังโหลด Snapshot จาก D1...';try{const r=await fetch(API);const j=await r.json();if(!j.ok)throw Error(j.error);rows=j.items||[];status.textContent='เชื่อม Cloudflare D1 แล้ว · Signal Engine 1D/3D/7D';render()}catch(err){status.textContent='โหลดข้อมูลไม่ได้: '+err.message}}function render(){const s=document.querySelector('#q').value.toLowerCase(),f=filter.value;let list=rows.filter(x=>(x.name+' '+x.category).toLowerCase().includes(s));if(f==='early')list=list.filter(x=>x.early_signal);if(f==='hot'||f==='watch')list=list.filter(x=>x.decision===f);if(f==='queue')list=list.filter(x=>x.queue);list.sort((a,b)=>b.score-a.score);k1.textContent=rows.length;k0.textContent=rows.filter(x=>x.early_signal).length;k2.textContent=rows.filter(x=>x.decision==='hot').length;k3.textContent=rows.filter(x=>x.decision==='watch').length;k4.textContent=rows.filter(x=>x.queue).length;grid.innerHTML=list.map(x=>`<article class="bg-white rounded-2xl p-4 border ${x.early_signal?'border-violet-300 ring-1 ring-violet-100':'border-slate-100'}"><div class="flex justify-between gap-3"><div><div class="flex gap-1 flex-wrap">${x.early_signal?'<span class="text-xs bg-violet-100 text-violet-700 px-2 py-1 rounded-full font-bold">⚡ EARLY</span>':''}<span class="text-xs bg-slate-100 px-2 py-1 rounded-full">${e(x.category||'ไม่ระบุหมวด')}</span></div><h3 class="font-black mt-2">${e(x.name)}</h3><p class="text-xs text-slate-400 mt-1">Snapshot ล่าสุด ${e(x.snapshot_date||'-')}</p></div><div class="w-16 h-16 rounded-full border-4 border-orange-100 flex items-center justify-center font-black text-orange-600 text-xl">${x.score}</div></div><div class="grid grid-cols-3 gap-2 mt-4 text-center text-sm"><div class="bg-slate-50 rounded-xl p-2"><small>1D</small><b class="block ${x.growth_1d>0?'text-emerald-600':''}">${p(x.growth_1d)}</b></div><div class="bg-slate-50 rounded-xl p-2"><small>3D</small><b class="block">${p(x.growth_3d)}</b></div><div class="bg-slate-50 rounded-xl p-2"><small>7D</small><b class="block">${p(x.growth_7d)}</b></div></div><div class="grid grid-cols-3 gap-2 mt-2 text-center text-xs"><div class="bg-slate-50 rounded-xl p-2"><span class="text-slate-400">ยอด</span><b class="block text-sm">${Number(x.sales_today||0).toLocaleString()}</b></div><div class="bg-slate-50 rounded-xl p-2"><span class="text-slate-400">คู่แข่ง</span><b class="block text-sm">${Number(x.videos||0).toLocaleString()}</b></div><div class="bg-slate-50 rounded-xl p-2"><span class="text-slate-400">เร่งตัว</span><b class="block text-sm">${p(x.acceleration)}</b></div></div><div class="mt-3 font-bold">${x.decision==='hot'?'🔥 ทำทันที':x.decision==='watch'?'👀 จับตา':'❄️ ยังไม่เด่น'}</div><div class="mt-3 bg-orange-50 p-3 rounded-xl text-sm">${e(idea(x))}</div><div class="flex gap-2 mt-3"><button onclick="toggleQ('${x.id}',${!x.queue})" class="flex-1 py-2 rounded-xl font-bold ${x.queue?'bg-emerald-100 text-emerald-700':'bg-slate-900 text-white'}">${x.queue?'✓ Queue':'🎬 ทำคลิป'}</button>${x.url?`<a target="_blank" href="${e(x.url)}" class="border rounded-xl px-3 py-2">สินค้า</a>`:''}<button onclick="del('${x.id}')" class="border rounded-xl px-3 py-2">ลบ</button></div></article>`).join('')||'<div class="col-span-full text-center p-10 bg-white rounded-2xl">ยังไม่มีสินค้าในเรดาร์</div>'}async function toggleQ(id,queue){await fetch(API,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({id,queue})});load()}async function del(id){if(!confirm('ลบสินค้านี้?'))return;await fetch(API+'?id='+encodeURIComponent(id),{method:'DELETE'});load()}add.onclick=()=>modal.showModal();close.onclick=()=>modal.close();refresh.onclick=load;q.oninput=render;filter.onchange=render;form.onsubmit=async ev=>{ev.preventDefault();const b=Object.fromEntries(new FormData(form));status.textContent='กำลังบันทึก...';const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});const j=await r.json();if(!j.ok){status.textContent='บันทึกไม่สำเร็จ: '+j.error;return}form.reset();modal.close();load()};load();</script></body></html>
